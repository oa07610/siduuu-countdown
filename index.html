<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owais & Siduuu</title>
<meta name="description" content="Counting every heartbeat until Owais lands in Budapest.">
<meta property="og:title" content="Owais & Siduuu">
<meta property="og:description" content="Counting every heartbeat until we're together.">
<meta name="theme-color" content="#ffd6e7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff8fab;
    --pink-deep: #f0628f;
    --rose: #ffc2d1;
    --lav: #cdb4ff;
    --lav-deep: #a98bf0;
    --peach: #ffd6c9;
    --ink: #6b3a5b;
    --ink-soft: #9a6a8a;
    --card: rgba(255, 255, 255, 0.55);
    --card-border: rgba(255, 255, 255, 0.85);
    --shadow: 0 10px 30px rgba(240, 98, 143, 0.18), 0 2px 6px rgba(169, 139, 240, 0.12);
    --script: "Dancing Script", cursive;
    --round: "Quicksand", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: var(--round);
    color: var(--ink);
    background: #ffe1ec;
    background-image: linear-gradient(135deg, #ffe1ec 0%, #f3e1ff 40%, #ffe9dc 70%, #ffd6e7 100%);
    background-size: 300% 300%;
    animation: drift 24s ease-in-out infinite;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* soft blurred colour blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
    animation: float 18s ease-in-out infinite;
  }
  .blob.b1 { width: 340px; height: 340px; background: #ffb3c6; top: -80px; left: -60px; }
  .blob.b2 { width: 300px; height: 300px; background: #d8c3ff; bottom: -60px; right: -40px; animation-delay: -6s; }
  .blob.b3 { width: 220px; height: 220px; background: #ffd6a5; top: 45%; left: 60%; animation-delay: -12s; opacity: 0.35; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.06); }
    66% { transform: translate(-20px, 25px) scale(0.96); }
  }

  #hearts {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 2;
    max-width: 860px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }

  .route-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .route-pill svg { width: 18px; height: 18px; fill: var(--pink-deep); }

  h1 {
    margin: 4px 0 0;
    font-family: var(--script);
    font-weight: 700;
    font-size: clamp(2.8rem, 11vw, 5.2rem);
    line-height: 1.05;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.15em 0.3em;
    background: linear-gradient(90deg, var(--pink-deep), var(--lav-deep), var(--pink-deep));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  .beat {
    width: 0.62em;
    height: 0.62em;
    flex: none;
    animation: heartbeat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(240, 98, 143, 0.45));
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.22); }
    30% { transform: scale(1); }
    45% { transform: scale(1.14); }
  }

  .subtitle {
    margin: -6px 0 0;
    font-size: clamp(1rem, 3.6vw, 1.2rem);
    font-weight: 500;
    color: var(--ink-soft);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* countdown */
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
  }
  .unit {
    position: relative;
    padding: 22px 8px 16px;
    overflow: hidden;
  }
  .unit::before {
    content: "";
    position: absolute;
    inset: auto -20% -60% -20%;
    height: 80%;
    background: radial-gradient(closest-side, rgba(255, 179, 198, 0.45), transparent);
    pointer-events: none;
  }
  .num {
    display: block;
    font-weight: 700;
    font-size: clamp(2.4rem, 9vw, 4.4rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--pink-deep), var(--lav-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .num.bump { animation: bump 0.45s ease-out; }
  @keyframes bump {
    0% { transform: translateY(-6px) scale(1.08); opacity: 0.4; }
    100% { transform: none; opacity: 1; }
  }
  .label {
    display: block;
    margin-top: 8px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .unit.secs .mini {
    position: absolute;
    top: 9px;
    right: 11px;
    width: 14px;
    height: 14px;
    fill: var(--pink);
  }
  .unit.secs.tick .mini { animation: heartbeat 0.6s ease-out; }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .chip {
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .chip.sleeps {
    background: linear-gradient(90deg, #ffb3c6, #d8c3ff);
    color: #fff;
    text-shadow: 0 1px 2px rgba(107, 58, 91, 0.25);
    box-shadow: var(--shadow);
  }

  /* journey */
  .journey { width: 100%; padding: 18px 16px 14px; }
  .journey h2, .clocks h2 {
    margin: 0 0 4px;
    font-family: var(--script);
    font-size: clamp(1.6rem, 6vw, 2.1rem);
    color: var(--pink-deep);
  }
  .journey svg { width: 100%; height: auto; display: block; overflow: visible; }
  .track { fill: none; stroke: #f5c4d6; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
  .trail { fill: none; stroke: url(#trailGrad); stroke-width: 4; stroke-linecap: round; }
  .place { font-family: var(--round); font-weight: 700; font-size: 18px; fill: var(--ink-soft); }
  .pin { fill: var(--pink); }
  .pin.end { fill: var(--pink-deep); }
  #plane path { fill: var(--lav-deep); }
  .pct { margin: 2px 0 0; font-weight: 600; color: var(--ink-soft); }
  .pct strong { color: var(--pink-deep); font-size: 1.15em; }

  /* clocks */
  .clocks { width: 100%; padding: 18px 16px; }
  .clock-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }
  .clock .who { font-weight: 600; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .clock .time { font-weight: 700; font-size: clamp(1.5rem, 6vw, 2.1rem); font-variant-numeric: tabular-nums; color: var(--ink); }
  .clock .day { font-size: 0.9rem; color: var(--ink-soft); }
  .clock .sky { font-size: 1.4rem; display: block; margin-bottom: 2px; }
  .apart { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-soft); font-size: 0.8rem; font-weight: 600; }
  .apart svg { width: 26px; height: 26px; fill: var(--pink); animation: heartbeat 1.6s ease-in-out infinite; }

  /* love note */
  .note {
    width: 100%;
    padding: 26px 22px;
    position: relative;
  }
  .note .quote {
    font-family: var(--script);
    font-size: clamp(1.45rem, 5.4vw, 2rem);
    line-height: 1.3;
    margin: 0;
    min-height: 2.6em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .note .quote.fade { opacity: 0; transform: translateY(8px); }
  .note .sig { margin-top: 10px; font-weight: 600; color: var(--ink-soft); }

  /* arrival state */
  .arrived-msg { display: none; }
  body.arrived .countdown,
  body.arrived .sleeps,
  body.arrived .until,
  body.arrived .meta-row { display: none; }
  body.arrived .arrived-msg { display: block; width: 100%; padding: 26px 18px; }
  .arrived-msg .big {
    font-family: var(--script);
    font-size: clamp(2.4rem, 10vw, 4rem);
    color: var(--pink-deep);
    margin: 0;
  }
  .arrived-msg .together { margin-top: 8px; font-weight: 600; font-size: 1.1rem; color: var(--ink-soft); }

  footer {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    opacity: 0.85;
  }

  @media (max-width: 560px) {
    .countdown { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .clock-row { grid-template-columns: 1fr; }
    .apart { flex-direction: row; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    body, .blob, h1, .beat, .apart svg { animation: none !important; }
    .num.bump { animation: none; }
    .note .quote { transition: none; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <canvas id="hearts" aria-hidden="true"></canvas>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="heart" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </symbol>
      <linearGradient id="beatGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff8fab"/>
        <stop offset="1" stop-color="#f0628f"/>
      </linearGradient>
    </defs>
  </svg>

  <main>
    <div class="route-pill">
      Sydney
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" transform="rotate(90 12 12)"/></svg>
      Budapest
    </div>

    <h1>
      <span>Owais</span>
      <svg class="beat" viewBox="0 0 24 24" aria-label="loves"><use href="#heart" fill="url(#beatGrad)"/></svg>
      <span>Siduuu</span>
    </h1>
    <p class="subtitle" id="subtitle">counting every heartbeat until I'm holding you</p>

    <section class="countdown" role="timer" aria-label="Time until we meet">
      <div class="unit card"><span class="num" id="d">0</span><span class="label">days</span></div>
      <div class="unit card"><span class="num" id="h">00</span><span class="label">hours</span></div>
      <div class="unit card"><span class="num" id="m">00</span><span class="label">minutes</span></div>
      <div class="unit card secs" id="secsCard">
        <svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>
        <span class="num" id="s">00</span><span class="label">seconds</span>
      </div>
    </section>

    <section class="arrived-msg card" aria-live="polite">
      <p class="big">I'm here, Siduuu 💗</p>
      <p class="together" id="together"></p>
    </section>

    <div class="meta-row">
      <span class="chip sleeps" id="sleeps"></span>
      <span class="chip card until" id="landing"></span>
    </div>

    <section class="journey card">
      <h2>on my way to you</h2>
      <svg viewBox="0 0 600 150" aria-hidden="true">
        <defs>
          <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#cdb4ff"/>
            <stop offset="1" stop-color="#f0628f"/>
          </linearGradient>
        </defs>
        <path id="route" class="track" d="M 40 110 C 140 10, 250 10, 300 70 S 470 140, 560 45"/>
        <path id="trail" class="trail" d="M 40 110 C 140 10, 250 10, 300 70 S 470 140, 560 45"/>
        <use href="#heart" class="pin" x="30" y="100" width="20" height="20"/>
        <use href="#heart" class="pin end" x="547" y="32" width="26" height="26"/>
        <text class="place" x="40" y="142" text-anchor="middle">Sydney</text>
        <text class="place" x="560" y="22" text-anchor="middle">Budapest</text>
        <g id="plane">
          <path d="M 12 -2 L -4 -2 L -10 -9 L -13 -9 L -9 -2 L -14 -2 L -17 -5 L -19 -5 L -17 0 L -19 5 L -17 5 L -14 2 L -9 2 L -13 9 L -10 9 L -4 2 L 12 2 Q 15 0 12 -2 Z"/>
        </g>
      </svg>
      <p class="pct" id="pct"></p>
    </section>

    <section class="clocks card">
      <h2>our clocks right now</h2>
      <div class="clock-row">
        <div class="clock">
          <span class="sky" id="skyA"></span>
          <div class="who">Owais · Sydney</div>
          <div class="time" id="timeA">--:--</div>
          <div class="day" id="dayA"></div>
        </div>
        <div class="apart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>
          <span id="apart"></span>
        </div>
        <div class="clock">
          <span class="sky" id="skyB"></span>
          <div class="who">Siduuu · Budapest</div>
          <div class="time" id="timeB">--:--</div>
          <div class="day" id="dayB"></div>
        </div>
      </div>
    </section>

    <section class="note card">
      <p class="quote" id="quote"></p>
      <div class="sig">— Owais</div>
    </section>

    <footer>made with love for Siduuu · tap anywhere for hearts</footer>
  </main>

<script>
(function () {
  // Landing in Budapest: Fri 23 Oct 2026, 08:00 local (CEST, UTC+2).
  const TARGET = new Date("2026-10-23T08:00:00+02:00").getTime();
  // When the countdown started: Sun 18 Oct 2026, 16:17 in Sydney (AEDT, UTC+11).
  const START = new Date("2026-10-18T16:17:00+11:00").getTime();
  const TZ_A = "Australia/Sydney";
  const TZ_B = "Europe/Budapest";

  const NOTES = [
    "Every second that passes is one second closer to you.",
    "Halfway around the world, and you're still the first thing I think about.",
    "My bags aren't packed yet, but my heart is already in Budapest.",
    "15,800 km between us — and shrinking every second.",
    "Can't wait to walk along the Danube holding your hand.",
    "Sleep tight, Siduuu. Very soon I'll say goodnight in person.",
    "Counting the days, the hours, the minutes… and the heartbeats.",
    "No time zone is strong enough to keep me away from you."
  ];

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  // ---------- time-zone helpers ----------
  function partsIn(tz, date) {
    const f = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
    });
    const out = {};
    for (const p of f.formatToParts(date)) out[p.type] = p.value;
    return out;
  }
  function offsetMinutes(tz, date) {
    const p = partsIn(tz, date);
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
    return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
  }
  function dayNumber(tz, date) {
    const p = partsIn(tz, date);
    return Date.UTC(+p.year, +p.month - 1, +p.day) / 86400000;
  }
  const timeFmt = (tz) => new Intl.DateTimeFormat("en-AU", { timeZone: tz, hour: "numeric", minute: "2-digit", hour12: true });
  const dayFmt = (tz) => new Intl.DateTimeFormat("en-AU", { timeZone: tz, weekday: "long", day: "numeric", month: "short" });
  const fA = timeFmt(TZ_A), fB = timeFmt(TZ_B), dA = dayFmt(TZ_A), dB = dayFmt(TZ_B);
  const landFmt = new Intl.DateTimeFormat("en-AU", { timeZone: TZ_B, weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });

  function sky(tz, date) {
    const h = +partsIn(tz, date).hour;
    if (h >= 6 && h < 12) return "🌤️";
    if (h >= 12 && h < 18) return "☀️";
    if (h >= 18 && h < 21) return "🌇";
    return "🌙";
  }

  // ---------- journey path ----------
  const route = $("route"), trail = $("trail"), plane = $("plane");
  const L = route.getTotalLength();
  trail.style.strokeDasharray = L;
  function setProgress(p) {
    p = Math.min(1, Math.max(0, p));
    trail.style.strokeDashoffset = L * (1 - p);
    const at = L * p;
    const a = route.getPointAtLength(Math.max(0, at - 1));
    const b = route.getPointAtLength(Math.min(L, at + 1));
    const pt = route.getPointAtLength(at);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    plane.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${(pt.y - 2).toFixed(1)}) rotate(${ang.toFixed(1)})`);
  }

  // ---------- countdown ----------
  const els = { d: $("d"), h: $("h"), m: $("m"), s: $("s") };
  const last = {};
  let arrived = null;

  function setNum(key, val) {
    if (last[key] === val) return;
    last[key] = val;
    const el = els[key];
    el.textContent = val;
    if (!reduceMotion) {
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
    }
  }

  $("landing").textContent = "landing " + landFmt.format(new Date(TARGET)) + " in Budapest";

  function update() {
    const nowDate = new Date();
    const now = nowDate.getTime();
    const diff = TARGET - now;
    const isArrived = diff <= 0;

    if (isArrived !== arrived) {
      document.body.classList.toggle("arrived", isArrived);
      $("subtitle").textContent = isArrived ? "together at last" : "counting every heartbeat until I'm holding you";
      if (isArrived && arrived === false) celebrate();
      if (isArrived && arrived === null && now - TARGET < 6 * 3600000) celebrate();
      arrived = isArrived;
    }

    if (!isArrived) {
      const total = Math.floor(diff / 1000);
      setNum("d", String(Math.floor(total / 86400)));
      setNum("h", pad(Math.floor(total / 3600) % 24));
      setNum("m", pad(Math.floor(total / 60) % 60));
      setNum("s", pad(total % 60));
      const card = $("secsCard");
      card.classList.remove("tick"); void card.offsetWidth; card.classList.add("tick");

      const sleeps = dayNumber(TZ_B, new Date(TARGET)) - dayNumber(TZ_B, nowDate);
      $("sleeps").textContent =
        sleeps <= 0 ? "today's the day! 💞" :
        sleeps === 1 ? "just 1 more sleep 🌙" :
        sleeps + " sleeps to go 🌙";
    } else {
      const t = Math.floor((now - TARGET) / 1000);
      const d = Math.floor(t / 86400), h = Math.floor(t / 3600) % 24, m = Math.floor(t / 60) % 60;
      $("together").textContent = "together for " + (d ? d + "d " : "") + h + "h " + pad(m) + "m 💕";
    }

    const p = (now - START) / (TARGET - START);
    setProgress(p);
    $("pct").innerHTML = isArrived
      ? "<strong>landed!</strong> right where I belong"
      : "<strong>" + Math.min(99, Math.max(0, Math.floor(p * 100))) + "%</strong> of the way to you";

    $("timeA").textContent = fA.format(nowDate);
    $("timeB").textContent = fB.format(nowDate);
    $("dayA").textContent = dA.format(nowDate);
    $("dayB").textContent = dB.format(nowDate);
    $("skyA").textContent = sky(TZ_A, nowDate);
    $("skyB").textContent = sky(TZ_B, nowDate);
    const gap = Math.abs(offsetMinutes(TZ_A, nowDate) - offsetMinutes(TZ_B, nowDate)) / 60;
    $("apart").textContent = (Number.isInteger(gap) ? gap : gap.toFixed(1)) + " hours apart";
  }

  function loop() {
    update();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 10);
  }

  // ---------- love notes ----------
  let noteIdx = Math.floor(Math.random() * NOTES.length);
  const quote = $("quote");
  quote.textContent = NOTES[noteIdx];
  setInterval(() => {
    quote.classList.add("fade");
    setTimeout(() => {
      noteIdx = (noteIdx + 1) % NOTES.length;
      quote.textContent = NOTES[noteIdx];
      quote.classList.remove("fade");
    }, reduceMotion ? 0 : 700);
  }, 7000);

  // ---------- floating hearts canvas ----------
  const canvas = $("hearts");
  const ctx = canvas.getContext("2d");
  const COLORS = ["#ff8fab", "#ffb3c6", "#cdb4ff", "#ffc8dd", "#f7a1c4", "#bde0fe", "#f0628f"];
  let W = 0, H = 0, DPR = 1;
  const floaters = [];
  const bursts = [];

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const want = reduceMotion ? 0 : Math.round(Math.min(30, Math.max(12, W / 45)));
    while (floaters.length < want) floaters.push(newFloater(true));
    floaters.length = want;
  }

  function newFloater(anywhere) {
    const size = 8 + Math.random() * 20;
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + size,
      size,
      speed: 12 + Math.random() * 30,          // px per second
      sway: 8 + Math.random() * 26,
      phase: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.6,
      alpha: 0.3 + Math.random() * 0.45,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }

  // MDN heart: bbox x 20..130, y 25..120, centred near (75, 72)
  function drawHeart(x, y, size, rot, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    const k = size / 110;
    ctx.scale(k, k);
    ctx.translate(-75, -72);
    ctx.beginPath();
    ctx.moveTo(75, 40);
    ctx.bezierCurveTo(75, 37, 70, 25, 50, 25);
    ctx.bezierCurveTo(20, 25, 20, 62.5, 20, 62.5);
    ctx.bezierCurveTo(20, 80, 40, 102, 75, 120);
    ctx.bezierCurveTo(110, 102, 130, 80, 130, 62.5);
    ctx.bezierCurveTo(130, 62.5, 130, 25, 100, 25);
    ctx.bezierCurveTo(85, 25, 75, 37, 75, 40);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function burst(x, y, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (80 + Math.random() * 200) * power;
      bursts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 60 * power,
        size: 10 + Math.random() * 16,
        rot: (Math.random() - 0.5) * 0.8,
        life: 1,
        decay: 0.5 + Math.random() * 0.4,
        color: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
  }

  function celebrate() {
    const go = () => burst(W / 2, H / 2.5, reduceMotion ? 12 : 70, 1.4);
    go();
    if (!reduceMotion) { setTimeout(go, 700); setTimeout(go, 1400); }
  }

  let prev = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - prev) / 1000);
    prev = t;
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      f.y -= f.speed * dt;
      f.phase += dt * 0.9;
      if (f.y < -f.size * 2) floaters[i] = newFloater(false);
      drawHeart(f.x + Math.sin(f.phase) * f.sway, f.y, f.size, Math.sin(f.phase) * f.spin, f.color, f.alpha);
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.vx *= 0.97; b.vy = b.vy * 0.97 - 20 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= b.decay * dt;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      drawHeart(b.x, b.y, b.size * (0.6 + b.life * 0.4), b.rot, b.color, Math.max(0, b.life));
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("pointerdown", (e) => burst(e.clientX, e.clientY, reduceMotion ? 4 : 14, 1));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) update(); });

  resize();
  loop();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
